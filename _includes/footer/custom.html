<!-- LGBTQIA+ Progress Pride flag — a discreet, year-round show of support.
     Official Quasar "Progress" variant (Wikimedia Commons, CC0), served locally.
     Muted by default, full-colour on hover/focus. -->
<img class="pride-flag" src="/images/pride-progress-flag.png"
     width="30" height="19" loading="lazy" decoding="async"
     alt="LGBTQIA+ Progress Pride flag">
<style>
  .pride-flag {
    display: inline-block;
    vertical-align: middle;
    margin-left: 0.6em;
    height: 19px;
    width: auto;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
    opacity: 0.55;
    filter: saturate(0.7);
    transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s ease;
  }
  .pride-flag:hover, .pride-flag:focus-visible {
    opacity: 1;
    filter: saturate(1);
    transform: translateY(-1px);
  }
</style>
